<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falling Sun</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#12061f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c" aria-label="Falling Sun game"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
const R=Math.random,TAU=Math.PI*2;
let best=0;try{best=+localStorage.getItem('fs_best')||0}catch(e){}
let st='menu',S={t:0,score:0,L:100,P:0,combo:0,max:0,sp:0,nb:40,boss:null},shards=[],shades=[],parts=[],pulse=null,px=0,tx=0,keys={},shake=0,flash=0,popups=[];
const stars=Array.from({length:70},()=>({x:R(),y:R(),s:R()*1.6+.4,p:R()*TAU}));
function reset(){S={t:0,score:0,L:100,P:0,combo:0,max:0,sp:0,nb:40,boss:null};shards=[];shades=[];parts=[];popups=[];pulse=null;px=tx=W/2;st='play';A.start()}
// ---------- audio ----------
const A={ctx:null,on:true,step:0,next:0,timer:null,
init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();this.m=this.ctx.createGain();this.m.gain.value=.5;this.m.connect(this.ctx.destination)}catch(e){}},
tone(f,t,d,type,v,sl){if(!this.ctx||!this.on)return;const c=this.ctx,o=c.createOscillator(),a=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t+d);a.gain.setValueAtTime(v||.2,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(this.m);o.start(t);o.stop(t+d+.02)},
sfx(k,n){if(!this.ctx)return;const t=this.ctx.currentTime;
if(k=='catch')this.tone(520*Math.pow(1.122,Math.min(n,12)),t,.18,'triangle',.22);
if(k=='hit'){this.tone(140,t,.4,'sawtooth',.28,40)}
if(k=='miss')this.tone(220,t,.2,'sine',.15,110);
if(k=='pulse'){this.tone(200,t,.6,'sine',.3,1200);this.tone(300,t,.5,'triangle',.15,60)}
if(k=='over'){[392,330,262,196].forEach((f,i)=>this.tone(f,t+i*.18,.5,'triangle',.22))}},
start(){this.init();if(this.ctx&&this.ctx.state=='suspended')this.ctx.resume();if(this.timer)return;this.next=this.ctx?this.ctx.currentTime+.1:0;
this.timer=setInterval(()=>this.sched(),80)},
sched(){if(!this.ctx||!this.on||st=='menu')return;const sc=[0,3,5,7,10,12,15,12,10,7,5,3],roots=[110,98,87.3,98];
const gap=st=='play'?Math.max(.11,.2-S.t*.0009):.26;
while(this.next<this.ctx.currentTime+.25){const i=this.step,root=roots[(i>>4)&3],n=sc[i%sc.length];
this.tone(root*2*Math.pow(2,n/12),this.next,.22,'triangle',st=='play'?.07:.045);
if(i%8==0)this.tone(root,this.next,gap*6,'sine',.16);
this.step++;this.next+=gap}}};
// ---------- input ----------
function pointer(e){tx=e.clientX}
cv.addEventListener('pointermove',pointer);
cv.addEventListener('pointerdown',e=>{A.init();A.start();tx=e.clientX;
if(st!='play'){if(st=='menu'||st=='over')reset();return}
const b=btn();if(e.clientX>b.x&&e.clientY>b.y)firePulse()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
if(k==' '||k=='enter'){e.preventDefault();A.init();A.start();if(st!='play')reset();else if(k==' ')firePulse()}
if(k=='m')A.on=!A.on});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function btn(){return{x:W-110,y:H-110}}
function firePulse(){if(S.P<100||pulse)return;S.P=0;pulse={r:10};A.sfx('pulse');flash=.5}
// ---------- helpers ----------
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=R()*TAU,v=(R()*.7+.3)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R()*.5+.4,m:.9,c:col,s:R()*3+1})}}
function pop(x,y,t,c){popups.push({x,y,t,c,l:.8})}
function mult(){return Math.min(8,1+Math.floor(S.combo/5))}
function caught(s,auto){S.combo++;S.max=Math.max(S.max,S.combo);const m=mult();S.score+=10*m;S.L=Math.min(100,S.L+7);if(!pulse)S.P=Math.min(100,S.P+(S.boss?16:9));
A.sfx('catch',S.combo);burst(s.x,s.y,'#ffd35a',10,160);pop(s.x,s.y-14,'+'+10*m,'#ffe9a0')}
// ---------- update ----------
const py=()=>H-84;
function update(dt){
if(st!='play'){return}
S.t+=dt;const lvl=1+Math.floor(S.t/20);
const dir=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
if(dir){tx=Math.max(30,Math.min(W-30,tx+dir*720*dt))}
tx=Math.max(30,Math.min(W-30,tx));px+=(tx-px)*Math.min(1,dt*16);
S.L-=(2.6+S.t*.045)*dt;
if(!S.boss&&S.t>=S.nb){const mx=3+Math.floor(S.t/90);S.boss={x:W/2,y:-80,hp:mx,max:mx,ph:0,fire:1.5,hit:0};pop(W/2,H/2,'THE ECLIPSE','#ff8a9c');shake=.5;A.sfx('hit')}
const B=S.boss;if(B){B.ph+=dt;B.y+=(150-B.y)*Math.min(1,dt*2);B.x=W/2+Math.sin(B.ph*.9)*(W*.32);B.hit=Math.max(0,B.hit-dt);B.fire-=dt;
if(B.fire<=0){B.fire=Math.max(.9,1.7-S.t*.004);const n=B.max>3?5:3;for(let i=0;i<n;i++){const a=Math.PI/2+(i-(n-1)/2)*.38;shades.push({x:B.x,y:B.y+30,v:230*Math.sin(a)+60,vx:230*Math.cos(a),w:R()*TAU,r:15})}A.sfx('miss')}}
S.sp-=dt;if(S.sp<=0){S.sp=Math.max(.26,.85-S.t*.011);
const x=30+R()*(W-60),v=Math.min(130+S.t*3.2,360)*(.85+R()*.3);
if(R()<Math.min(.5,.24+S.t*.004))shades.push({x,y:-20,v:v*1.05,w:R()*TAU,r:17});else shards.push({x,y:-20,v,r:11,w:R()*TAU})}
const catchY=py();
for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.y+=s.v*dt;s.w+=dt*4;
if(pulse&&Math.hypot(s.x-px,s.y-catchY)<pulse.r+20){caught(s,1);shards.splice(i,1);continue}
if(Math.abs(s.x-px)<40&&s.y>catchY-14&&s.y<catchY+16){caught(s);shards.splice(i,1)}
else if(s.y>H+20){S.combo=0;S.L-=4;A.sfx('miss');shards.splice(i,1)}}
for(let i=shades.length-1;i>=0;i--){const s=shades[i];s.y+=s.v*dt;s.x+=(s.vx||0)*dt;s.w+=dt*3;
if(pulse&&Math.hypot(s.x-px,s.y-catchY)<pulse.r){S.score+=25;burst(s.x,s.y,'#b06cff',16,220);pop(s.x,s.y,'+25','#d9b3ff');shades.splice(i,1);continue}
if(Math.abs(s.x-px)<42&&s.y>catchY-18&&s.y<catchY+18){S.L-=24;S.combo=0;shake=.35;A.sfx('hit');burst(s.x,s.y,'#ff4f6d',22,260);shades.splice(i,1)}
else if(s.y>H+30)shades.splice(i,1)}
if(pulse){pulse.r+=Math.min(W,900)*1.1*dt;const b2=S.boss;
if(b2&&!pulse.h&&Math.hypot(b2.x-px,b2.y-catchY)<pulse.r){pulse.h=1;b2.hp--;b2.hit=.4;shake=.4;burst(b2.x,b2.y,'#ffd35a',30,280);A.sfx('hit');
if(b2.hp<=0){S.score+=500;S.L=Math.min(100,S.L+30);burst(b2.x,b2.y,'#ffd35a',90,400);pop(b2.x,b2.y,'+500 ECLIPSE BROKEN','#fff1b0');shades.length=0;S.boss=null;S.nb=S.t+50}}
if(pulse.r>Math.max(W,H)*.9)pulse=null}
if(S.L<=0){S.L=0;st='over';A.sfx('over');shake=.6;burst(W/2,70,'#ffd35a',60,320);
if(S.score>best){best=S.score;try{localStorage.setItem('fs_best',best)}catch(e){}}}}
function tick(dt){
shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y-=40*dt;p.l-=dt;if(p.l<=0)popups.splice(i,1)}}
// ---------- draw ----------
function txt(s,x,y,sz,col,al,wt){g.font=(wt||'600')+' '+sz+'px Georgia,"Times New Roman",serif';g.textAlign=al||'center';g.fillStyle=col;g.fillText(s,x,y)}
function draw(time){
const L=st=='menu'?80:S.L,k=L/100;
g.save();if(shake>0)g.translate((R()-.5)*shake*24,(R()-.5)*shake*24);
const bg=g.createLinearGradient(0,0,0,H);
bg.addColorStop(0,`rgb(${40+k*60|0},${10+k*14|0},${50+k*10|0})`);bg.addColorStop(.6,`rgb(${24+k*40|0},${8+k*6|0},${44})`);bg.addColorStop(1,'#0a0414');
g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
for(const s of stars){g.globalAlpha=(.3+.4*Math.sin(time/700+s.p))*(1-k*.4);g.fillStyle='#fff';g.fillRect(s.x*W,s.y*H*.8,s.s,s.s)}g.globalAlpha=1;
// sun
const sx=W/2,sy=64,sr=16+k*30;
let gl=g.createRadialGradient(sx,sy,0,sx,sy,sr*4.2);gl.addColorStop(0,`rgba(255,196,80,${.55*k+.1})`);gl.addColorStop(1,'rgba(255,120,40,0)');
g.fillStyle=gl;g.beginPath();g.arc(sx,sy,sr*4.2,0,TAU);g.fill();
g.fillStyle=`rgb(255,${150+k*80|0},${60+k*40|0})`;g.beginPath();g.arc(sx,sy,sr,0,TAU);g.fill();
g.strokeStyle=`rgba(255,200,90,${.3+k*.5})`;g.lineWidth=2;
for(let i=0;i<12;i++){const a=i/12*TAU+time/2500;g.beginPath();g.moveTo(sx+Math.cos(a)*(sr+6),sy+Math.sin(a)*(sr+6));g.lineTo(sx+Math.cos(a)*(sr+12+k*8),sy+Math.sin(a)*(sr+12+k*8));g.stroke()}
if(st!='menu'){
// pulse ring
if(pulse){g.strokeStyle='rgba(255,230,160,.8)';g.lineWidth=6;g.beginPath();g.arc(px,py(),pulse.r,0,TAU);g.stroke();g.strokeStyle='rgba(255,230,160,.25)';g.lineWidth=22;g.stroke()}
// shards
for(const s of shards){g.save();g.translate(s.x,s.y);g.rotate(Math.sin(s.w)*.4);
gl=g.createRadialGradient(0,0,0,0,0,26);gl.addColorStop(0,'rgba(255,211,90,.5)');gl.addColorStop(1,'rgba(255,211,90,0)');g.fillStyle=gl;g.beginPath();g.arc(0,0,26,0,TAU);g.fill();
g.fillStyle='#ffd35a';g.beginPath();g.moveTo(0,-s.r*1.3);g.lineTo(s.r*.8,0);g.lineTo(0,s.r*1.3);g.lineTo(-s.r*.8,0);g.closePath();g.fill();
g.fillStyle='#fff6d0';g.beginPath();g.moveTo(0,-s.r*.8);g.lineTo(s.r*.3,0);g.lineTo(0,s.r*.4);g.lineTo(-s.r*.3,0);g.closePath();g.fill();g.restore()}
// shades
for(const s of shades){g.save();g.translate(s.x,s.y);g.rotate(s.w*.3);
g.fillStyle='#1a0830';g.strokeStyle='#8a3dff';g.lineWidth=2;g.beginPath();
for(let i=0;i<10;i++){const a=i/10*TAU,r=i%2?s.r*.65:s.r*1.25;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.stroke();
g.rotate(-s.w*.3);g.fillStyle='#ff4f6d';g.fillRect(-7,-4,4,6);g.fillRect(3,-4,4,6);g.restore()}
const B=S.boss;if(B){g.save();g.translate(B.x,B.y);const r=46;gl=g.createRadialGradient(0,0,r*.6,0,0,r*2);gl.addColorStop(0,'rgba(138,61,255,.5)');gl.addColorStop(1,'rgba(138,61,255,0)');g.fillStyle=gl;g.beginPath();g.arc(0,0,r*2,0,TAU);g.fill();g.fillStyle=B.hit>0?'#fff':'#0d0418';g.strokeStyle='#ffb347';g.lineWidth=4;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.stroke();g.fillStyle='#ff4f6d';g.fillRect(-18,-8,10,12);g.fillRect(8,-8,10,12);
for(let i=0;i<B.max;i++){g.fillStyle=i<B.hp?'#ff4f6d':'#3a2050';g.fillRect(-B.max*9+i*18,r+12,14,6)}g.restore()}
// player lantern
const y=py();gl=g.createRadialGradient(px,y,0,px,y,70);gl.addColorStop(0,`rgba(255,200,100,${.25+k*.25})`);gl.addColorStop(1,'rgba(255,200,100,0)');
g.fillStyle=gl;g.beginPath();g.arc(px,y,70,0,TAU);g.fill();
g.fillStyle='#2b1646';g.strokeStyle='#ffd35a';g.lineWidth=3;g.beginPath();g.moveTo(px-38,y-10);g.quadraticCurveTo(px,y+34,px+38,y-10);g.closePath();g.fill();g.stroke();
g.fillStyle=S.P>=100?'#fff1b0':'#ffb347';g.beginPath();g.arc(px,y-12,6+(S.P>=100?2*Math.sin(time/90):0),0,TAU);g.fill();}
// particles
for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s)}g.globalAlpha=1;
for(const p of popups){g.globalAlpha=Math.min(1,p.l*2);txt(p.t,p.x,p.y,18,p.c);}g.globalAlpha=1;
if(flash>0){g.fillStyle=`rgba(255,235,170,${flash*.5})`;g.fillRect(-20,-20,W+40,H+40)}
g.restore();
// HUD
if(st!='menu'){
txt(String(S.score).padStart(5,'0'),16,34,28,'#ffe9a0','left','700');
txt('Best '+best,16,56,14,'#c9a6ff','left','500');
txt('Level '+(1+Math.floor(S.t/20)),W-16,34,16,'#c9a6ff','right','600');
if(S.combo>1)txt('×'+mult()+'  streak '+S.combo,W-16,56,14,'#ffd35a','right','600');
const bw=Math.min(300,W-40),bx=(W-bw)/2,by=H-26;
g.fillStyle='rgba(255,255,255,.1)';g.fillRect(bx,by,bw,8);g.fillStyle=S.L<30?'#ff4f6d':'#ffd35a';g.fillRect(bx,by,bw*S.L/100,8);
g.fillStyle='rgba(255,255,255,.1)';g.fillRect(bx,by-14,bw,5);g.fillStyle=S.P>=100?'#fff1b0':'#8a3dff';g.fillRect(bx,by-14,bw*S.P/100,5);
if(S.P>=100&&!pulse)txt((S.boss?'Strike the Eclipse! Space or tap ☀':'Pulse ready — Space or tap ☀'),W/2,by-24,14,'#fff1b0','center','600');
if('ontouchstart' in window||matchMedia('(pointer:coarse)').matches){const b=btn();g.globalAlpha=S.P>=100?1:.35;g.fillStyle='#ffd35a';g.beginPath();g.arc(W-55,H-55,34,0,TAU);g.fill();txt('☀',W-55,H-44,32,'#3b1a00');g.globalAlpha=1}}
if(st=='menu'||st=='over'){g.fillStyle='rgba(10,4,20,.62)';g.fillRect(0,0,W,H)}
const cy=H/2;
if(st=='menu'){
txt('Falling Sun',W/2,cy-60,Math.min(64,W/7),'#ffd35a','center','700');
txt('The sun is dying. Catch its light before it hits the dark.',W/2,cy-20,Math.min(18,W/22),'#f3e6ff','center','400');
txt('Move: mouse, touch or ← → / A D',W/2,cy+24,15,'#c9a6ff','center','400');
txt('Catch gold shards. Dodge shadows. Pulse (Space) clears them.',W/2,cy+46,15,'#c9a6ff','center','400');
txt('M mutes sound',W/2,cy+68,13,'#9a7fc4','center','400');
if(Math.sin(time/300)>-.3)txt('Tap or press Enter to begin',W/2,cy+112,22,'#ffe9a0','center','700')}
if(st=='over'){
txt('The light went out',W/2,cy-60,Math.min(48,W/9),'#ff8a9c','center','700');
txt('Score '+S.score+(S.score>=best&&S.score>0?'  — new best!':'  ·  Best '+best),W/2,cy-14,24,'#ffe9a0','center','600');
txt('Longest streak '+S.max+' · Survived '+Math.floor(S.t)+'s',W/2,cy+18,16,'#c9a6ff','center','400');
if(Math.sin(time/300)>-.3)txt('Tap or press Enter to relight',W/2,cy+70,22,'#ffe9a0','center','700')}}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);tick(dt);draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
